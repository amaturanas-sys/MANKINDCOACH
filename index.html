    <title>MankindFactory | Routine Workspace · Alberto Maturana S.</title>

    <!--
      Pre-paint del tema para evitar flash blanco al cargar la SPA en tema dark.
      Lee el theme guardado en localStorage o respeta prefers-color-scheme.
      Se ejecuta antes del bundle de React, así el atributo data-theme ya está
      aplicado cuando se monta el primer estilo.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mankind_theme');
          var preferLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (preferLight ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          var bg = theme === 'light' ? '#f6f5fb' : '#09090b';
          document.documentElement.style.backgroundColor = bg;
          document.body && (document.body.style.backgroundColor = bg);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', bg);
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Solo registrar SW si estamos servidos por HTTP(S). En file:// o data: no funciona.
      if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Service Worker registrado en', registration.scope);
            })
            .catch((error) => {
              console.error('Fallo el registro del Service Worker:', error);
            });
        });
      }
    </script>
  </body>
